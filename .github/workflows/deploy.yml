# Senior SafeSpot SG — CI/CD Pipeline
# Quality gate (type check + unit tests + production build) on every push/PR,
# followed by an automated Google Cloud Run deploy on main.
name: CI/CD Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint • Test • Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # VITE_* vars are baked into the client bundle at build time
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  check-deploy-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      has_gcp_key: ${{ steps.check.outputs.has_gcp_key }}
    steps:
      # `secrets` cannot be used in a job-level `if`, so its presence is
      # probed here and exposed as an output the deploy job can condition on.
      - name: Probe GCP_SA_KEY
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: echo "has_gcp_key=$([ -n "$GCP_SA_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloud Run (asia-southeast1)
    needs: [quality, check-deploy-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-deploy-secrets.outputs.has_gcp_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # `--source .` makes Cloud Build re-run the Dockerfile, so the dist/ built
      # in the quality job is NOT what ships. The VITE_* vars must therefore be
      # available to that container build: Vite picks them up from .env.production.
      - name: Write client build-time env for the Cloud Build image
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          # The step env above is exported into this shell, so the VITE_* pairs
          # can be dumped straight into the file Vite reads during the image build.
          env | grep '^VITE_' > .env.production
          cut -d= -f1 .env.production   # log names only, never values

      # Server-side secrets are injected at runtime via --set-env-vars below.
      - name: Deploy to Cloud Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
          ONE_MAP_EMAIL: ${{ secrets.ONE_MAP_EMAIL }}
          ONE_MAP_PASSWORD: ${{ secrets.ONE_MAP_PASSWORD }}
        run: |
          ENV_FLAGS=()
          VARS=""
          [ -n "$GEMINI_API_KEY" ] && VARS="${VARS:+$VARS,}GEMINI_API_KEY=$GEMINI_API_KEY"
          [ -n "$GOOGLE_MAPS_API_KEY" ] && VARS="${VARS:+$VARS,}GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY"
          [ -n "$SPEECHMATICS_API_KEY" ] && VARS="${VARS:+$VARS,}SPEECHMATICS_API_KEY=$SPEECHMATICS_API_KEY"
          [ -n "$ONE_MAP_EMAIL" ] && VARS="${VARS:+$VARS,}ONE_MAP_EMAIL=$ONE_MAP_EMAIL"
          [ -n "$ONE_MAP_PASSWORD" ] && VARS="${VARS:+$VARS,}ONE_MAP_PASSWORD=$ONE_MAP_PASSWORD"

          if [ -n "$VARS" ]; then
            ENV_FLAGS=(--update-env-vars "$VARS")
          fi

          gcloud run deploy safespot-sg \
            --region asia-southeast1 \
            --source . \
            --allow-unauthenticated \
            "${ENV_FLAGS[@]}"
